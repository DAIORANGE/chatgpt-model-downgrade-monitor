name: Publish v1.4.1 release and topics

on:
  push:
    paths:
      - '.github/workflows/publish-v1.4.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set repository topics
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PUT \
            -H 'Accept: application/vnd.github+json' \
            /repos/${{ github.repository }}/topics \
            --input - <<'JSON'
          {
            "names": [
              "chatgpt",
              "openai",
              "tampermonkey",
              "userscript",
              "firefox",
              "cross-browser",
              "model-routing",
              "model-monitoring",
              "model-downgrade",
              "sse",
              "proof-of-work"
            ]
          }
          JSON

      - name: Create v1.4.1 tag and release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.4.1 >/dev/null 2>&1; then
            echo 'Release v1.4.1 already exists; skipping creation.'
            exit 0
          fi

          if ! git rev-parse v1.4.1 >/dev/null 2>&1; then
            git tag -a v1.4.1 -m 'ChatGPT Model Downgrade Monitor v1.4.1'
            git push origin v1.4.1
          fi

          gh release create v1.4.1 \
            ChatGPT-Model-Downgrade-Monitor.user.js \
            ChatGPT-Model-Downgrade-Monitor.user.js.sha256 \
            --title 'ChatGPT Model Downgrade Monitor | 模型鉴定姬 v1.4.1' \
            --notes-file RELEASE_NOTES_v1.4.1.md \
            --verify-tag
