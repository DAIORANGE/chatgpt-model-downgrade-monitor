name: Rebuild userscript from staged parts

on:
  push:
    paths:
      - '.parts/**'
      - '.github/workflows/rebuild-userscript.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild userscript
        shell: bash
        run: |
          set -euo pipefail
          cat .parts/part*.b64 | base64 -d > ChatGPT-Model-Downgrade-Monitor.user.js
          node --check ChatGPT-Model-Downgrade-Monitor.user.js
          sha256sum ChatGPT-Model-Downgrade-Monitor.user.js > ChatGPT-Model-Downgrade-Monitor.user.js.sha256
          grep -q '^// @version      1.4.1$' ChatGPT-Model-Downgrade-Monitor.user.js
          grep -q '^// @homepageURL  https://github.com/DAIORANGE/chatgpt-model-downgrade-monitor$' ChatGPT-Model-Downgrade-Monitor.user.js
          grep -q '^// @updateURL    https://raw.githubusercontent.com/DAIORANGE/chatgpt-model-downgrade-monitor/main/ChatGPT-Model-Downgrade-Monitor.user.js$' ChatGPT-Model-Downgrade-Monitor.user.js

      - name: Commit generated public userscript
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ChatGPT-Model-Downgrade-Monitor.user.js ChatGPT-Model-Downgrade-Monitor.user.js.sha256
          git rm -r .parts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'release: publish v1.4.1 userscript'
          git push origin HEAD:main
