          Path('LICENSE').write_text(license_text, encoding='utf-8', newline='')

          zh_section = '''## 许可证与商业授权

本项目源码以 **PolyForm Noncommercial License 1.0.0** 提供。

- 个人、学习、研究、业余项目及其他符合该许可证定义的**非商业用途**可以在许可证条款范围内使用、修改和分发；
- 该许可证**不授予商业使用权**；
- 如需商业使用、商业集成、收费分发，或希望获得其他商业授权，请联系作者 **DAIORANGE** 另行授权；
- 赞助 / 打赏属于对作者维护工作的自愿支持，**不会自动授予额外的商业使用权或其他许可权利**。

完整条款见 [LICENSE](LICENSE) 与 PolyForm Noncommercial 1.0.0 官方文本。

'''
          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          if '## 许可证与商业授权\n' not in r:
              anchor = '## 隐私\n'
              if anchor not in r:
                  raise SystemExit('README zh privacy anchor not found')
              r = r.replace(anchor, zh_section + anchor, 1)
              readme.write_text(r, encoding='utf-8', newline='')

          en_section = '''## License and commercial licensing

This project is source-available under the **PolyForm Noncommercial License 1.0.0**.

- Personal, educational, research, hobby, and other **noncommercial uses** permitted by the license may use, modify, and distribute the software within the license terms;
- this license **does not grant commercial-use rights**;
- for commercial use, commercial integration, paid distribution, or other commercial licensing, contact **DAIORANGE** for a separate license;
- sponsorships or donations are voluntary support for project maintenance and **do not automatically grant additional commercial-use rights or other license rights**.

See [LICENSE](LICENSE) and the official PolyForm Noncommercial 1.0.0 terms for the complete license.

'''
          readme_en = Path('README_EN.md')
          e = readme_en.read_text(encoding='utf-8')
          if '## License and commercial licensing\n' not in e:
              anchor = '## Privacy\n'
              if anchor not in e:
                  raise SystemExit('README EN privacy anchor not found')
              e = e.replace(anchor, en_section + anchor, 1)
              readme_en.write_text(e, encoding='utf-8', newline='')

          listing = Path('GREASYFORK_LISTING.md')
          g = listing.read_text(encoding='utf-8')
          gf_section = '''## License / 许可证
PolyForm Noncommercial License 1.0.0 (`PolyForm-Noncommercial-1.0.0`).

非商业用途可按许可证条款使用、修改和分发。商业使用、商业集成或收费分发请联系作者 DAIORANGE 另行授权。赞助 / 打赏不会自动授予商业使用权。

Noncommercial use, modification, and distribution are permitted under the license terms. For commercial use, commercial integration, or paid distribution, contact DAIORANGE for a separate commercial license. Sponsorships or donations do not automatically grant commercial-use rights.

'''
          if '## License / 许可证\n' not in g:
              anchor = '## Disclaimer\n'
              if anchor not in g:
                  raise SystemExit('Greasy Fork disclaimer anchor not found')
              g = g.replace(anchor, gf_section + anchor, 1)
              listing.write_text(g, encoding='utf-8', newline='')
          PY

          rm -f .github/workflows/license-setup-once.yml
          node --check ChatGPT-Model-Downgrade-Monitor.user.js
          sha256sum ChatGPT-Model-Downgrade-Monitor.user.js > ChatGPT-Model-Downgrade-Monitor.user.js.sha256

          git config user.name "DAIORANGE"
          git config user.email "121008037@qq.com"
          git add -A
          git commit -m "docs: adopt PolyForm Noncommercial licensing [license-setup-done]"
          git push origin HEAD:main
