name: license-setup-once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[license-setup-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add PolyForm Noncommercial license and commercial licensing notice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          def dec(s):
              return base64.b64decode(s.encode()).decode('utf-8')

          script = Path('ChatGPT-Model-Downgrade-Monitor.user.js')
          s = script.read_text(encoding='utf-8')
          marker = '// @author       DAIORANGE\n'
          license_line = '// @license      PolyForm-Noncommercial-1.0.0\n'
          if license_line not in s:
              if marker not in s:
                  raise SystemExit('userscript author marker not found')
              s = s.replace(marker, marker + license_line, 1)
              script.write_text(s, encoding='utf-8', newline='')

          Path('LICENSE').write_text(dec(''), encoding='utf-8', newline='')

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          if '## 许可证与商业授权\n' not in r:
              anchor = '## 隐私\n'
              if anchor not in r:
                  raise SystemExit('README zh privacy anchor not found')
              r = r.replace(anchor, dec('IyMg6K645Y+v6K+B5LiO5ZWG5Lia5o6I5p2DCgrmnKzpobnnm67mupDnoIHku6UgKipQb2x5Rm9ybSBOb25jb21tZXJjaWFsIExpY2Vuc2UgMS4wLjAqKiDmj5DkvpvooYzjgIIKCi0g5Liq5Lq644CB5a2m5Lmg44CB56CU56m244CB5Lia5L2Z6aG555uu5Y+K5YW25LuW56ym5ZCI6K+l6K645Y+v6K+B5a6a5LmJ55qEKirmnKzllYbkuJrn”¨”¯5oyBvvIzKirmNjeS4muS8muiHquWKq5o6I5LqI6aKd5aSW55qE5ZWG5Lia5L2/55So5p2D5oiW5YW25LuW6K645Y+v5p2D5YipKirmnJ3jgIIKCOWujOaVtOadoea1geeahOWPiCBbTElDRU5TRV0oTElDRU5TRSkg5LiOIFBvbHlGb3JtIE5vbmNvbW1lcmNpYWwgMS4wLjAg5a6Y5paH5pys44CCCgo=' ) + anchor, 1)
              readme.write_text(r, encoding='utf-8', newline='')

          readme_en = Path('README_EN.md')
          e = readme_en.read_text(encoding='utf-8')
          if '## License and commercial licensing\n' not in e:
              anchor = '## Privacy\n'
              if anchor not in e:
                  raise SystemExit('README EN privacy anchor not found')
              e = e.replace(anchor, dec('') + anchor, 1)
              readme_en.write_text(e, encoding='utf-8', newline='')

          listing = Path('GREASYFORK_LISTING.md')
          g = listing.read_text(encoding='utf-8')
          if '## License / 许可证\n' not in g:
              anchor = '## Disclaimer\n'
              if anchor not in g:
                  raise SystemExit('Greasy Fork disclaimer anchor not found')
              g = g.replace(anchor, dec('') + anchor, 1)
              listing.write_text(g, encoding='utf-8', newline='')
          PY

          rm -f .github/workflows/license-setup-once.yml
          node --check ChatGPT-Model-Downgrade-Monitor.user.js
          sha256sum ChatGPT-Model-Downgrade-Monitor.user.js > ChatGPT-Model-Downgrade-Monitor.user.js.sha256

          git config user.name "DAIORANGE"
          git config user.email "121008037@qq.com"
          git add -A
          git commit -m "docs: adopt PolyForm Noncommercial licensing [license-setup-done]"
          git push origin HEAD:main
