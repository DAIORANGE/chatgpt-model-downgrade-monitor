name: license-setup-once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[license-setup-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply licensing metadata and notices
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path('ChatGPT-Model-Downgrade-Monitor.user.js')
          s = script.read_text(encoding='utf-8')
          marker = '// @author       DAIORANGE\n'
          license_line = '// @license      PolyForm-Noncommercial-1.0.0\n'
          if license_line not in s:
              if marker not in s:
                  raise SystemExit('userscript author marker not found')
              s = s.replace(marker, marker + license_line, 1)
              script.write_text(s, encoding='utf-8', newline='')

          zh = "## 许可证与商业授权\n\n本项目源码以 **PolyForm Noncommercial License 1.0.0** 提供。\n\n- 个人、学习、研究、业余项目及其他符合该许可证定义的**非商业用途**可以在许可证条款范围内使用、修改和分发；\n- 该许可证**不授予商业使用权**；\n- 如需商业使用、商业集成、收费分发，或希望获得其他商业授权，请联系作者 **DAIORANGE** 另行授权；\n- 赞助 / 打赏属于对作者维护工作的自愿支持，**不会自动授予额外的商业使用权或其他许可权利**。\n\n完整条款见 [LICENSE](LICENSE) 与 PolyForm Noncommercial 1.0.0 官方文本。\n\n"
          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          if '## 许可证与商业授权\n' not in r:
              anchor = '## 隐私\n'
              if anchor not in r:
                  raise SystemExit('README zh privacy anchor not found')
              readme.write_text(r.replace(anchor, zh + anchor, 1), encoding='utf-8', newline='')

          en = "## License and commercial licensing\n\nThis project is source-available under the **PolyForm Noncommercial License 1.0.0**.\n\n- Personal, educational, research, hobby, and other **noncommercial uses** permitted by the license may use, modify, and distribute the software within the license terms;\n- this license **does not grant commercial-use rights**;\n- for commercial use, commercial integration, paid distribution, or other commercial licensing, contact **DAIORANGE** for a separate license;\n- sponsorships or donations are voluntary support for project maintenance and **do not automatically grant additional commercial-use rights or other license rights**.\n\nSee [LICENSE](LICENSE) and the official PolyForm Noncommercial 1.0.0 terms for the complete license.\n\n"
          readme_en = Path('README_EN.md')
          e = readme_en.read_text(encoding='utf-8')
          if '## License and commercial licensing\n' not in e:
              anchor = '## Privacy\n'
              if anchor not in e:
                  raise SystemExit('README EN privacy anchor not found')
              readme_en.write_text(e.replace(anchor, en + anchor, 1), encoding='utf-8', newline='')

          gf = "## License / 许可证\nPolyForm Noncommercial License 1.0.0 (`PolyForm-Noncommercial-1.0.0`).\n\n非商业用途可按许可证条款使用、修改和分发。商业使用、商业集成或收费分发请联系作者 DAIORANGE 另行授权。赞助 / 打赏不会自动授予商业使用权。\n\nNoncommercial use, modification, and distribution are permitted under the license terms. For commercial use, commercial integration, or paid distribution, contact DAIORANGE for a separate commercial license. Sponsorships or donations do not automatically grant commercial-use rights.\n\n"
          listing = Path('GREASYFORK_LISTING.md')
          g = listing.read_text(encoding='utf-8')
          if '## License / 许可证\n' not in g:
              anchor = '## Disclaimer\n'
              if anchor not in g:
                  raise SystemExit('Greasy Fork disclaimer anchor not found')
              listing.write_text(g.replace(anchor, gf + anchor, 1), encoding='utf-8', newline='')
          PY

          rm -f .github/workflows/license-setup-once.yml
          node --check ChatGPT-Model-Downgrade-Monitor.user.js
          sha256sum ChatGPT-Model-Downgrade-Monitor.user.js > ChatGPT-Model-Downgrade-Monitor.user.js.sha256

          git config user.name "DAIORANGE"
          git config user.email "121008037@qq.com"
          git add -A
          git commit -m "docs: adopt PolyForm Noncommercial licensing [license-setup-done]"
          git push origin HEAD:main
